name: Sync Google Drive

on:
  schedule:
    - cron: '*/30 * * * *' # Run automatically every 30 minutes
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Drive crawler
        run: |
          python tools/enumerate.py
          python tools/build_data.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add manifest.json js/data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data from Google Drive" && git push)
